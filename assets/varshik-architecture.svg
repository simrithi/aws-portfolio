<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Varshik system architecture</title>
<desc id="d">Five tiers: evidence from dashcam frames and Copernicus terrain, a Python geospatial pipeline, SageMaker inference, delivery through S3, CloudFront and a React map, then Bedrock, EventBridge with Lambda, SNS and DynamoDB reacting to events.</desc>
